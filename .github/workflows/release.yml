name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run deterministic checks
        run: make check
      - name: Run browser integration tests
        shell: bash
        run: |
          browser_path="$(command -v chromium || command -v chromium-browser || command -v google-chrome)"
          test -n "$browser_path"
          make test-browser-race CHROMIUM="$browser_path"
      - name: Build archives and publish the GitHub release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
