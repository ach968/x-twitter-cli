name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run deterministic checks
        run: make check
      - name: Scan reachable dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  browser:
    name: Chromium integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run browser integration tests
        shell: bash
        run: |
          browser_path="$(command -v chromium || command -v chromium-browser || command -v google-chrome)"
          test -n "$browser_path"
          make test-browser-race CHROMIUM="$browser_path"
